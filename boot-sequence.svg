<svg width="700" height="240" viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #010409; }
      .line {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #8b949e;
        opacity: 0;
      }
      .ok { fill: #3fb950; font-weight: 700; }
      .final { fill: #7ee787; font-weight: 700; }

      @keyframes reveal {
        to { opacity: 1; }
      }
      .l1  { animation: reveal 0.3s ease-out forwards 0.2s; }
      .l2  { animation: reveal 0.3s ease-out forwards 0.7s; }
      .l3  { animation: reveal 0.3s ease-out forwards 1.2s; }
      .l4  { animation: reveal 0.3s ease-out forwards 1.7s; }
      .l5  { animation: reveal 0.3s ease-out forwards 2.2s; }
      .l6  { animation: reveal 0.3s ease-out forwards 2.7s; }
      .l7  { animation: reveal 0.3s ease-out forwards 3.3s; }
      .cursor {
        fill: #7ee787;
        animation: blink 1s steps(1) infinite;
        animation-delay: 3.6s;
        opacity: 0;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect class="bg" width="700" height="240" rx="10"/>

  <text x="24" y="34"  class="line l1"><tspan class="ok">[ OK ]</tspan> Booting hike-042 profile daemon...</text>
  <text x="24" y="62"  class="line l2"><tspan class="ok">[ OK ]</tspan> Loading recruitment_automation.service</text>
  <text x="24" y="90"  class="line l3"><tspan class="ok">[ OK ]</tspan> Mounting ai_tooling.module</text>
  <text x="24" y="118" class="line l4"><tspan class="ok">[ OK ]</tspan> Starting sourcing_engine.process (Boolean / X-Ray)</text>
  <text x="24" y="146" class="line l5"><tspan class="ok">[ OK ]</tspan> Linking github.identity :: hike-042</text>
  <text x="24" y="174" class="line l6"><tspan class="ok">[ OK ]</tspan> Verifying network :: NetConnect Global (NCG)</text>
  <text x="24" y="210" class="line l7 final">System ready. Welcome to Arco's terminal.</text>
  <rect x="24" y="216" width="10" height="16" class="cursor"/>
</svg>
